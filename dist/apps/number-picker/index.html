<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="번호 범위와 제외 번호를 정하고, 중복 없이 공정하게 뽑아 보세요. 로그인과 학생 이름 입력 없이 사용할 수 있습니다."><meta name="theme-color" content="#ffffff"><title>무작위 번호 뽑기 — 교실 도구함</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script type="module" src="./picker.mjs"></script></head><body>
<a class="skip" href="#main">본문으로 건너뛰기</a><header class="site-header"><a href="/" class="small-brand"><img src="/favicon.svg" width="28" height="28" alt=""><span>교실 도구함</span></a><a href="/" class="text-button"><span data-icon="grid"></span>모든 도구</a></header>
<main id="main" class="picker-main"><div class="page-heading"><a class="breadcrumb" href="/"><span data-icon="back"></span>도구함으로 돌아가기</a><div class="page-title-row"><div class="tool-icon"><span data-icon="dice"></span></div><div><h1>무작위 번호 뽑기</h1><p>누가 먼저 할까요? 공정하게 뽑고, 즐겁게 시작해요.</p></div></div></div>
<div class="picker-layout"><form id="settings" class="settings-panel" novalidate><h2>어떻게 뽑을까요?</h2><div class="field-row"><div class="field"><label for="start">시작 번호</label><input type="number" id="start" min="1" max="999" step="1" value="1" inputmode="numeric" required></div><div class="field"><label for="end">끝 번호</label><input type="number" id="end" min="1" max="999" step="1" value="30" inputmode="numeric" required></div></div><div class="field"><label for="count">한 번에 뽑을 개수</label><input type="number" id="count" min="1" max="100" step="1" value="1" inputmode="numeric" required></div><div class="field"><label for="excluded">제외할 번호 <span class="muted">(선택)</span></label><input type="text" id="excluded" maxlength="5000" placeholder="예: 3, 7, 12" aria-describedby="excluded-hint"><p class="field-hint" id="excluded-hint">쉼표나 공백으로 구분해 주세요.</p></div><label class="switch-label" for="avoid-repeats"><input type="checkbox" id="avoid-repeats" checked><span><strong>이미 뽑은 번호 제외하기</strong><small>모두에게 한 번씩 기회가 돌아가도록</small></span></label><p class="settings-note">범위·제외 번호·중복 설정을 바꾸면 다음 추첨은 새로 시작돼요. 이름이나 학생 명단은 입력하지 않아요.</p><button type="submit" class="sr-only" tabindex="-1">번호 뽑기</button></form>
<div class="picker-content"><section class="result-panel" id="result-panel" aria-label="추첨 결과"><div class="result-top"><span><span class="live-dot"></span><span id="pool-count">30개 번호 중에서</span></span><button class="icon-button" id="fullscreen" aria-label="결과 전체 화면" title="결과 전체 화면" data-icon="fullscreen"></button></div><div class="result-display"><div id="result-placeholder" class="result-placeholder" aria-hidden="true">?</div><div id="result-numbers" class="result-numbers" aria-label="뽑힌 번호"></div><p class="result-caption" id="result-caption">오늘의 주인공을 기다리고 있어요</p></div><p id="picker-error" class="form-error" role="alert"></p><div class="result-actions"><button id="draw" class="button primary"><span data-icon="dice"></span><span id="draw-label">번호 뽑기</span></button><button id="reset" class="button secondary"><span data-icon="refresh"></span>다시 시작</button></div><p class="result-footnote">결과는 이 화면에서만 유지돼요.</p><p id="result-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p></section>
<section class="history" aria-labelledby="history-title"><div class="history-header"><h2 id="history-title">이번 추첨 기록</h2><span>최근 20회</span></div><p id="history-empty" class="history-empty">번호를 뽑으면 여기에 차곡차곡 기록돼요.</p><ol id="history-list" class="history-list"></ol></section></div></div></main>
<footer class="site-footer"><span>작은 도구, 더 여유로운 교실.</span><a href="/">교실 도구함으로 돌아가기</a></footer><div id="toast" role="status" aria-live="polite" class="toast"></div><noscript><p class="notice">번호를 뽑으려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript></body></html>
