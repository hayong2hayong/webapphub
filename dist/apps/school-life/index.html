<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="세종 한솔고등학교 2학년 8반의 오늘 급식과 이번 주 시간표를 확인하세요.">
  <meta name="theme-color" content="#ffffff">
  <title>급식·시간표 — 교실 도구함</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="./school-life.css">
  <script type="module" src="./school-life.mjs"></script>
</head>
<body class="school-page">
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <a href="/" class="small-brand"><img src="/favicon.svg" width="28" height="28" alt=""><span>교실 도구함</span></a>
    <a href="/" class="text-button"><span data-icon="grid"></span>모든 도구</a>
  </header>
  <main id="main" class="school-main">
    <div class="page-heading school-heading">
      <a class="breadcrumb" href="/"><span data-icon="back"></span>도구함으로 돌아가기</a>
      <div class="school-title-line">
        <div class="page-title-row">
          <div class="tool-icon"><span data-icon="book"></span></div>
          <div><h1>급식·시간표</h1><p>우리 반의 하루를 미리 확인해요.</p></div>
        </div>
        <div class="school-identity"><span>한솔고등학교 <small>세종</small></span><strong>2학년 8반</strong></div>
      </div>
    </div>

    <section class="date-bar" aria-label="조회 날짜 선택">
      <div class="selected-date-heading"><p id="date-context">오늘</p><h2 id="selected-date">오늘의 학교생활</h2></div>
      <div class="date-controls">
        <button type="button" id="previous-date" class="button secondary date-arrow" aria-label="이전 날짜" title="이전 날짜"><span data-icon="back"></span></button>
        <div class="date-field"><label for="school-date" class="sr-only">조회 날짜</label><input id="school-date" type="date" required aria-describedby="date-help date-error"></div>
        <button type="button" id="next-date" class="button secondary date-arrow" aria-label="다음 날짜" title="다음 날짜"><span data-icon="arrow"></span></button>
        <button type="button" id="today-date" class="button secondary">오늘</button>
      </div>
      <p id="date-error" class="date-error" role="alert"></p>
    </section>
    <div class="school-data-meta"><p id="date-help">한국 시간 기준</p><p id="data-status" role="status">학교 자료를 불러오고 있어요.</p></div>

    <section id="global-state" class="school-global" hidden aria-labelledby="global-state-title"></section>

    <div id="school-content" data-mobile-view="meals">
      <div class="mobile-view-switch" role="tablist" aria-label="학교생활 보기">
        <button id="meals-tab" type="button" role="tab" aria-controls="meals-panel" aria-selected="true" tabindex="0"><span data-icon="book"></span>급식</button>
        <button id="timetable-tab" type="button" role="tab" aria-controls="timetable-panel" aria-selected="false" tabindex="-1"><span data-icon="grid"></span>시간표</button>
      </div>
      <div class="school-layout">
        <section id="meals-panel" class="school-panel meals-panel" aria-labelledby="meals-title" aria-busy="true">
          <div class="school-panel-heading"><div><p id="meal-date" class="panel-eyebrow">선택한 날짜</p><h2 id="meals-title">급식</h2></div><span class="panel-label">등록된 메뉴</span></div>
          <div id="meals-body" class="meals-body"><p class="initial-loading">급식 자료를 불러오고 있어요.</p></div>
        </section>
        <section id="timetable-panel" class="school-panel timetable-panel" aria-labelledby="timetable-title" aria-busy="true">
          <div class="school-panel-heading"><div><p id="week-range" class="panel-eyebrow">선택한 주</p><h2 id="timetable-title">주간 시간표</h2></div><span class="panel-label">2학년 8반</span></div>
          <div id="timetable-body" class="timetable-body"><p class="initial-loading">시간표 자료를 불러오고 있어요.</p></div>
        </section>
      </div>
    </div>
    <p id="school-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </main>
  <footer class="site-footer school-footer"><span>자료 출처 <a href="https://open.neis.go.kr/" target="_blank" rel="noopener noreferrer">나이스 교육정보개방포털</a></span><a href="/">교실 도구함으로 돌아가기</a></footer>
  <noscript><p class="notice">급식과 시간표를 보려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
</body>
</html>
